<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D1A10"/>
      <stop offset="100%" stop-color="#020608"/>
    </radialGradient>

    <!-- Neon green glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gold glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>

    <!-- Shield gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2A18"/>
      <stop offset="100%" stop-color="#071010"/>
    </linearGradient>

    <!-- Gold gradient for FF letters -->
    <linearGradient id="ffGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Inner hex gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Clip for inner circle -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="195"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Subtle hexagon grid pattern -->
  <g clip-path="url(#circleClip)" opacity="0.08">
    <path d="M128 60 L192 60 L224 113 L192 166 L128 166 L96 113 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M224 60 L288 60 L320 113 L288 166 L224 166 L192 113 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M320 60 L384 60 L416 113 L384 166 L320 166 L288 113 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M80 166 L144 166 L176 219 L144 272 L80 272 L48 219 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M176 166 L240 166 L272 219 L240 272 L176 272 L144 219 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M272 166 L336 166 L368 219 L336 272 L272 272 L240 219 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M368 166 L432 166 L464 219 L432 272 L368 272 L336 219 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M128 272 L192 272 L224 325 L192 378 L128 378 L96 325 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M224 272 L288 272 L320 325 L288 378 L224 378 L192 325 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M320 272 L384 272 L416 325 L384 378 L320 378 L288 325 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M176 378 L240 378 L272 431 L240 484 L176 484 L144 431 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
    <path d="M272 378 L336 378 L368 431 L336 484 L272 484 L240 431 Z" fill="none" stroke="#00FF88" stroke-width="1"/>
  </g>

  <!-- Outer decorative ring with dashes -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ringGrad)" stroke-width="2"
          stroke-dasharray="18 6" opacity="0.6" filter="url(#neonGlow)"/>

  <!-- Solid thin ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.25"/>

  <!-- Main shield body -->
  <path d="M256 76
           L380 128
           L380 272
           Q380 360 256 436
           Q132 360 132 272
           L132 128 Z"
        fill="url(#shieldGrad)"
        stroke="url(#ringGrad)"
        stroke-width="3"
        filter="url(#neonGlow)"/>

  <!-- Shield inner highlight -->
  <path d="M256 100
           L364 148
           L364 272
           Q364 348 256 416
           Q148 348 148 272
           L148 148 Z"
        fill="url(#hexGrad)"/>

  <!-- Inner glow ring inside shield -->
  <path d="M256 100
           L364 148
           L364 272
           Q364 348 256 416
           Q148 348 148 272
           L148 148 Z"
        fill="none"
        stroke="#00FF88"
        stroke-width="1"
        opacity="0.3"/>

  <!-- Crosshair / Target in center -->
  <g filter="url(#neonGlow)">
    <!-- Crosshair outer ring -->
    <circle cx="256" cy="240" r="56" fill="none" stroke="#00FF88" stroke-width="2.5" opacity="0.9"/>
    <!-- Crosshair inner ring -->
    <circle cx="256" cy="240" r="32" fill="none" stroke="#00D4FF" stroke-width="1.5" opacity="0.7"/>
    <!-- Crosshair dot -->
    <circle cx="256" cy="240" r="7" fill="#00FF88" opacity="0.95"/>
    <!-- Crosshair lines -->
    <line x1="256" y1="172" x2="256" y2="196" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="256" y1="284" x2="256" y2="308" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="188" y1="240" x2="212" y2="240" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="300" y1="240" x2="324" y2="240" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Diagonal tick marks -->
    <line x1="218" y1="202" x2="226" y2="210" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="286" y1="270" x2="294" y2="278" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="294" y1="202" x2="286" y2="210" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="226" y1="270" x2="218" y2="278" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- "FF" text in gold -->
  <text x="256" y="338"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="54"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="6"
        fill="url(#ffGold)"
        filter="url(#goldGlow)">FF</text>

  <!-- Bottom label "PRO ARENA" -->
  <text x="256" y="370"
        font-family="'Arial', sans-serif"
        font-size="18"
        font-weight="700"
        text-anchor="middle"
        letter-spacing="5"
        fill="#00FF88"
        opacity="0.9">PRO ARENA</text>

  <!-- "PK" badge at bottom of shield -->
  <rect x="228" y="400" width="56" height="24" rx="4" fill="#00FF88" opacity="0.15"
        stroke="#00FF88" stroke-width="1"/>
  <text x="256" y="417"
        font-family="'Arial Black', sans-serif"
        font-size="13"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="4"
        fill="#FFD700">PK</text>

  <!-- Corner accent dots -->
  <circle cx="256" cy="90"  r="3" fill="#00FF88" opacity="0.8"/>
  <circle cx="256" cy="422" r="3" fill="#00FF88" opacity="0.8"/>
  <circle cx="145" cy="142" r="3" fill="#00D4FF" opacity="0.6"/>
  <circle cx="367" cy="142" r="3" fill="#00D4FF" opacity="0.6"/>

  <!-- Neon corner bracket accents on outer ring -->
  <g stroke="#00FF88" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M60 210 L60 180 L90 180"/>
    <path d="M452 180 L452 210 M422 180 L452 180"/>
    <path d="M60 302 L60 332 L90 332"/>
    <path d="M452 302 L452 332 M422 332 L452 332"/>
  </g>
</svg>
